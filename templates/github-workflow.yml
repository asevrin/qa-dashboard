name: Test reports

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: qa-reports
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        id: tests
        run: {{TEST_COMMAND}}
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: pnpm allure:generate

      - name: Save raw report as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report
          if-no-files-found: error

      - name: Checkout reports archive
        if: always()
        uses: actions/checkout@v6
        with:
          ref: reports
          path: reports-site

      - name: Build report portal
        if: always()
        env:
          RUN_ID: ${{ github.run_number }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          REPORT_TYPE: {{REPORT_TYPE}}
          REPORT_ENVIRONMENT: {{ENVIRONMENT}}
        run: pnpm exec qa-dashboard build

      - name: Commit report archive
        if: always()
        run: |
          git -C reports-site config user.name "github-actions[bot]"
          git -C reports-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C reports-site add site
          git -C reports-site diff --cached --quiet || {
            git -C reports-site commit -m "Archive Allure report #${{ github.run_number }}"
            git -C reports-site push origin reports
          }

      - name: Create Worker secrets file
        if: always()
        env:
          REPORTS_USERNAME: ${{ secrets.REPORTS_USERNAME }}
          REPORTS_PASSWORD: ${{ secrets.REPORTS_PASSWORD }}
          REPORTS_SESSION_SECRET: ${{ secrets.REPORTS_SESSION_SECRET }}
        run: pnpm exec qa-dashboard create-secrets .report-secrets.json

      - name: Deploy report portal
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package=wrangler@4 -- wrangler deploy --config=qa-dashboard.wrangler.jsonc --secrets-file=.report-secrets.json

      - name: Notify Slack about new failures
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORTS_PORTAL_URL: ${{ secrets.REPORTS_PORTAL_URL }}
        run: pnpm exec qa-dashboard notify-slack reports-site/site/dashboard-data/reports.json

      - name: Mark run as failed if tests failed
        if: always() && steps.tests.outcome != 'success'
        run: exit 1
