<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/tms/favicon.svg" />
    <title>Defects · Manual TMS</title>
    <link rel="stylesheet" href="../app.css" />
    <link rel="stylesheet" href="../nav.css" />
    <link rel="stylesheet" href="./defects.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/"
          ><span class="brand-mark">T</span><span>Test management</span></a
        >
        <nav class="header-actions">
          <button class="theme-toggle" id="theme-toggle" type="button">
            ◐ <span id="theme-label">Dark</span></button
          ><a class="header-link" href="/">Automation reports</a
          ><a class="header-link" href="/logout">Log out</a>
        </nav>
      </header>
      <div class="tms-layout">
        <nav class="section-nav">
          <span class="nav-label">Manual TMS</span
          ><a href="../">Test repository</a><a href="../plans/">Test plans</a
          ><a href="../runs/">Test runs</a
          ><a class="active" href="./">Defects</a>
        </nav>
        <div class="tms-content">
          <section class="page-heading">
            <div>
              <h1>Defects</h1>
              <p>Track issues found during manual execution.</p>
            </div>
          </section>
          <section class="defect-toolbar">
            <label class="search"
              ><span>⌕</span
              ><input
                id="defect-search"
                type="search"
                placeholder="Search number, title, case, or run…" /></label
            ><select id="status-filter">
              <option value="all">All statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In progress</option>
              <option value="resolved">Resolved</option>
              <option value="wont_fix">Won’t fix</option></select
            ><select id="severity-filter">
              <option value="all">All severities</option>
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </section>
          <section class="defect-list" id="defect-list"></section>
        </div>
      </div>
    </main>
    <dialog id="defect-dialog">
      <form id="defect-form">
        <div class="dialog-heading">
          <h2 id="defect-dialog-title">Update defect</h2>
          <button class="icon-button" data-close type="button">×</button>
        </div>
        <p class="defect-context" id="defect-context"></p>
        <label
          >Status<select id="defect-status">
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="resolved">Resolved</option>
            <option value="wont_fix">Won’t fix</option>
          </select></label
        ><label
          >External issue URL <span class="field-hint">optional HTTPS link</span
          ><input
            id="defect-external-url"
            type="url"
            maxlength="2000"
            placeholder="https://linear.app/..."
        /></label>
        <p class="form-message" id="defect-message"></p>
        <div class="dialog-actions">
          <button class="secondary-button" data-close type="button">
            Cancel</button
          ><button class="primary-button">Save changes</button>
        </div>
      </form>
    </dialog>
    <script src="../shared.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
